name: 构建并发布整合包预览

on:
  workflow_dispatch:
    inputs:
      chinese_resources_asset:
        description: 额外构建 Windows 中日英包时，填写基包草稿中的中文资源 tar.gz 文件名（归档根目录为 chinese）
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: sakuratts-modelscope-preview
  cancel-in-progress: false

jobs:
  build:
    # GitHub 仅向具备推送权限的调用者返回 Release 草稿。
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.chinese_resources_asset && '["windows-x64","macos-arm64","windows-x64-zh"]' || '["windows-x64","macos-arm64"]') }}
    runs-on: ${{ startsWith(matrix.target, 'windows-x64') && 'windows-2022' || 'macos-15' }}
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      WEIGHTS_REVISION: 336b2ec4e8d4ac74740798dd40af44e74659ecaf
    steps:
      - name: 设置构建目录
        shell: bash
        run: echo "WORK=$RUNNER_TEMP/sakuratts-release" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: 安装构建工具
        run: python -m pip install build==1.3.0 packaging==25.0 setuptools==84.0.0 py7zr==1.1.3 ".[server]"
      - name: 验证打包与发布契约
        env:
          PYTHONPATH: tests
        run: python -m unittest test_build_preview test_portable_builder test_preparation_builder test_portable_runtime test_macos_portable test_portable_archive test_ci_release -q
      - name: 获取固定运行环境
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python scripts/fetch_ci_base.py --target '${{ startsWith(matrix.target, 'windows-x64') && 'windows-x64' || 'macos-arm64' }}' --directory "$WORK/base"
      - name: 读取中文离线前端资源
        if: matrix.target == 'windows-x64-zh'
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ inputs.chinese_resources_asset }}
        shell: bash
        run: |
          gh release download runtime-base-20261004 --pattern "$ASSET" --output "$WORK/chinese.tar.gz"
          python -c "import sys,tarfile; tarfile.open(sys.argv[1]).extractall(sys.argv[2],filter='data')" "$WORK/chinese.tar.gz" "$WORK/base"
      - name: 获取 FFmpeg 源码
        shell: bash
        run: |
          curl --fail --location --output "$WORK/ffmpeg-7.1.2.tar.xz" https://ffmpeg.org/releases/ffmpeg-7.1.2.tar.xz
          curl --fail --location --output "$WORK/libogg-1.3.5.tar.xz" https://downloads.xiph.org/releases/ogg/libogg-1.3.5.tar.xz
          curl --fail --location --output "$WORK/libvorbis-1.3.7.tar.xz" https://downloads.xiph.org/releases/vorbis/libvorbis-1.3.7.tar.xz
      - name: 恢复音频工具缓存
        id: ffmpeg-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ffmpeg-7.1.2-${{ runner.os == 'Windows' && 'windows-2022' || 'macos-15' }}-${{ runner.arch }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}
          path: |
            ${{ env.WORK }}/ffmpeg/ffmpeg
            ${{ env.WORK }}/ffmpeg/ffmpeg.exe
            ${{ env.WORK }}/ffmpeg/ffbuild/config.log
      - name: Windows 编译工具
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
        with:
          msystem: MINGW64
          update: false
          install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf
      - name: 构建 Windows 音频工具
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh "$(cygpath -u "$WORK")/ffmpeg-7.1.2.tar.xz" "$(cygpath -u "$WORK")/ffmpeg"
      - name: macOS 编译工具
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: brew install pkg-config
      - name: 构建 macOS 音频工具
        if: runner.os == 'macOS' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        env:
          MACOSX_DEPLOYMENT_TARGET: '14.0'
        shell: bash
        run: bash scripts/build_ffmpeg.sh "$WORK/ffmpeg-7.1.2.tar.xz" "$WORK/ffmpeg"
      - name: 保存音频工具缓存
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
          path: |
            ${{ env.WORK }}/ffmpeg/ffmpeg
            ${{ env.WORK }}/ffmpeg/ffmpeg.exe
            ${{ env.WORK }}/ffmpeg/ffbuild/config.log
      - name: 构建产品并装配整合包
        shell: bash
        run: |
          python -m build --wheel --outdir "$WORK/wheel"
          python -m pip download --only-binary=:all: --no-deps threadpoolctl==3.6.0 --dest "$WORK/threadpoolctl"
          if [[ '${{ runner.os }}' == Windows ]]; then platform=win_amd64; version=3.12; else platform=macosx_14_0_arm64; version=3.11; fi
          extras=(english)
          recipe=()
          if [[ '${{ matrix.target }}' == windows-x64-zh ]]; then
            extras+=(chinese)
            recipe=(--recipe packaging/recipes/windows-x64-zh.toml --chinese-resources "$WORK/base/chinese")
          fi
          python -c 'import sys,tomllib; deps=tomllib.load(open("pyproject.toml","rb"))["project"]["optional-dependencies"]; print("\n".join(dep for name in sys.argv[1:] for dep in deps[name]))' "${extras[@]}" > "$WORK/language-requirements.txt"
          if [[ '${{ matrix.target }}' == windows-x64-zh ]]; then
            python -m pip install --target "$WORK/language-dependencies" -r "$WORK/language-requirements.txt"
          else
            python -m pip install --only-binary=:all: --platform "$platform" --python-version "$version" \
              --target "$WORK/language-dependencies" -r "$WORK/language-requirements.txt"
          fi
          if [[ '${{ runner.os }}' == Windows ]]; then ffmpeg="$WORK/ffmpeg/ffmpeg.exe"; else ffmpeg="$WORK/ffmpeg/ffmpeg"; fi
          python scripts/rebuild_portable.py --bundle "$WORK/base/bundle" --wheel "$WORK"/wheel/*.whl \
            --threadpoolctl-wheel "$WORK"/threadpoolctl/*.whl \
            --language-dependencies "$WORK/language-dependencies" --english-resources "$WORK/base/english" "${recipe[@]}" \
            --ffmpeg "$ffmpeg" --ffmpeg-source "$WORK/ffmpeg-7.1.2.tar.xz" \
            --output "$WORK/SakuraTTS-${{ matrix.target }}"
      - name: 复用 Windows 验收权重
        if: runner.os == 'Windows'
        id: weights
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.WORK }}/test-weights
          key: gpt-sovits-v2proplus-${{ env.WEIGHTS_REVISION }}
      - name: 下载缺少的公共验收权重
        if: runner.os == 'Windows' && steps.weights.outputs.cache-hit != 'true'
        shell: bash
        run: |
          base="https://huggingface.co/lj1995/GPT-SoVITS/resolve/$WEIGHTS_REVISION"
          mkdir -p "$WORK/test-weights"
          curl --fail --location "$base/s1v3.ckpt" --output "$WORK/test-weights/gpt.ckpt"
          curl --fail --location "$base/v2Pro/s2Gv2ProPlus.pth" --output "$WORK/test-weights/sovits.pth"
      - name: 验证包内运行环境
        shell: bash
        run: |
          weights=()
          if [[ '${{ runner.os }}' == Windows ]]; then weights=(--gpt "$WORK/test-weights/gpt.ckpt" --sovits "$WORK/test-weights/sovits.pth"); fi
          python scripts/ci_portable_smoke.py --bundle "$WORK/SakuraTTS-${{ matrix.target }}" --output "$WORK/verification" "${weights[@]}"
      - name: Windows 7z 归档与内容检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: >-
          python scripts/archive_portable.py --bundle "$env:WORK/SakuraTTS-${{ matrix.target }}"
          --format 7z --profile balanced --sevenzip "$env:ProgramFiles/7-Zip/7z.exe"
          --output "$env:WORK/release"
      - name: macOS 归档与内容检查
        if: runner.os == 'macOS'
        shell: bash
        run: python scripts/archive_portable.py --bundle "$WORK/SakuraTTS-${{ matrix.target }}" --format tar.gz --output "$WORK/release"
      - name: 交付平台归档
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.target }}
          compression-level: 0
          retention-days: 1
          path: |
            ${{ env.WORK }}/release/*.7z
            ${{ env.WORK }}/release/*.tar.gz
            ${{ env.WORK }}/release/*.sha256
            ${{ env.WORK }}/release/compression-report.json
          if-no-files-found: error
      - name: 保存验收日志
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-${{ matrix.target }}
          path: |
            ${{ env.WORK }}/verification/*.json
            ${{ env.WORK }}/verification/*.log
            ${{ env.WORK }}/release/compression-report.json
            ${{ env.WORK }}/SakuraTTS-${{ matrix.target }}/logs/*.log
            ${{ env.WORK }}/ffmpeg/ffbuild/config.log
          if-no-files-found: ignore

  publish-platform:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.chinese_resources_asset && '["windows-x64","macos-arm64","windows-x64-zh"]' || '["windows-x64","macos-arm64"]') }}
    env:
      TQDM_MININTERVAL: '10'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ matrix.target }}
          path: release
      - run: python -m pip install modelscope-hub==0.4.5
      - name: 上传至魔搭版本目录
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: >-
          python scripts/publish_modelscope.py platform --directory release
          --target '${{ matrix.target }}' --release-id 'preview-${{ github.run_id }}-${{ github.run_attempt }}'
          --commit '${{ github.sha }}' --output 'published/${{ matrix.target }}.json'
      - name: 保存平台发布结果
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: published-${{ matrix.target }}
          path: published/*.json
          if-no-files-found: error

  publish-index:
    needs: publish-platform
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: published-*
          path: published
          merge-multiple: true
      - run: python -m pip install modelscope-hub==0.4.5
      - name: 更新预览版入口
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
        run: python scripts/publish_modelscope.py index --directory published --release-id 'preview-${{ github.run_id }}-${{ github.run_attempt }}' --commit '${{ github.sha }}' ${{ inputs.chinese_resources_asset && '--with-chinese' || '' }}
