[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sakuratts"
version = "0.1.0.dev0"
description = "Independent inference runtime for supported GPT-SoVITS models"
readme = "README.md"
license-files = ["docs/third-party/*.txt", "docs/third-party/*.md"]
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6"]

[project.optional-dependencies]
japanese = [
    "onnxruntime==1.30.0",
    "pyopenjtalk-plus==0.4.1.post9",
    "SudachiPy==0.6.11",
    "SudachiDict-core==20260723",
    "split-lang==2.1.1",
    "fast-langdetect==1.0.1",
    "fasttext-predict==0.9.2.4",
    "budoux==0.9.2",
]
nvidia = [
    "cupy-cuda12x==14.2.0",
    "nvidia-cuda-runtime-cu12==12.9.79",
    "nvidia-cuda-nvrtc-cu12==12.9.86",
    "nvidia-cublas-cu12==12.9.2.10",
]
# Conversion and regression tools, not dependencies of ordinary synthesis.
dev = [
    "psutil==7.2.2",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers==4.51.3",
    "soundfile==0.13.1",
    "onnx==1.23.0",
    "librosa==0.11.0",
    "x-transformers==2.28.8",
]

[project.scripts]
sakuratts = "sakuratts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sakuratts*"]
