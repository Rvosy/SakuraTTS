[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sakuratts"
version = "0.1.0a1"
description = "Independent inference runtime for supported GPT-SoVITS models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "docs/third-party/*.txt", "docs/third-party/*.md"]
authors = [{name = "Rvosy"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = ["numpy==2.4.6"]

[project.urls]
Repository = "https://github.com/Rvosy/SakuraTTS"
Issues = "https://github.com/Rvosy/SakuraTTS/issues"
Documentation = "https://github.com/Rvosy/SakuraTTS/blob/main/docs/quickstart.md"

[project.optional-dependencies]
japanese = [
    "onnxruntime==1.30.0",
    "pyopenjtalk-plus==0.4.1.post9",
    "SudachiPy==0.6.11",
    "SudachiDict-core==20260723",
    "split-lang==2.1.1",
    "fast-langdetect==1.0.1",
    "fasttext-predict==0.9.2.4",
    "budoux==0.9.2",
]
nvidia = [
    "cupy-cuda12x==14.2.0; sys_platform == 'win32'",
    "nvidia-cuda-runtime-cu12==12.9.79; sys_platform == 'win32'",
    "nvidia-cuda-nvrtc-cu12==12.9.86; sys_platform == 'win32'",
    "nvidia-cublas-cu12==12.9.2.10; sys_platform == 'win32'",
]
english = ["nltk==3.9.2", "wordsegment==1.3.1", "inflect==7.5.0"]
server = ["fastapi==0.141.1", "uvicorn==0.53.0", "PyYAML==6.0.3", "tqdm==4.70.1"]
mlx = ["mlx==0.32.2; sys_platform == 'darwin'", "mlx-metal==0.32.2; sys_platform == 'darwin'"]
chinese = ["tokenizers==0.21.4", "opencc-python-reimplemented==0.1.7", "pypinyin==0.55.0", "jieba-fast==0.53"]
# Export dependencies are never required for ordinary synthesis.
convert = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "transformers==4.51.3",
    "soundfile==0.13.1",
    "onnx==1.23.0",
    "librosa==0.11.0",
    "x-transformers==2.28.8",
]
dev = ["sakuratts[convert]", "psutil==7.2.2", "httpx==0.28.1"]

[project.scripts]
sakuratts = "sakuratts.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sakuratts*"]

[tool.setuptools]
include-package-data = false

[tool.uv]
environments = ["sys_platform == 'win32'", "sys_platform == 'darwin'"]
